services:
  - type: web
    name: study-os
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: study-os-db
          property: connectionString
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: AI_PROVIDER
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_MONTHLY_BUDGET_USD
        value: "2"
      - key: HF_ENDPOINT
        value: "https://hf-mirror.com"

databases:
  - name: study-os-db
    plan: free
    databaseName: studyos
    user: studyos
